<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc9e"/><stop offset=".45" stop-color="#c9a35a"/><stop offset="1" stop-color="#8a6326"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e1d12"/><stop offset=".45" stop-color="#9a5632"/><stop offset="1" stop-color="#3e1d12"/>
    </linearGradient>
  </defs>
  <!-- 手柄：先竖着画在镜框正下方，再绕镜片中心转到右下 45° -->
  <g transform="rotate(-45 18 18)">
    <rect x="15.4" y="30" width="5.2" height="5.4" rx="1" fill="url(#brass)" stroke="#5b3d14" stroke-width=".6"/>
    <path d="M14.6 35.2 h6.8 l.8 2 v9 a4 4 0 0 1 -8.4 0 v-9 z" fill="url(#wood)" stroke="#2a120a" stroke-width=".7"/>
    <rect x="14.2" y="38.6" width="7.6" height="1.3" fill="url(#brass)"/>
    <rect x="14.2" y="43.6" width="7.6" height="1.3" fill="url(#brass)"/>
    <circle cx="18" cy="50.6" r="2.5" fill="url(#brass)" stroke="#5b3d14" stroke-width=".6"/>
  </g>
  <!-- 镜片 -->
  <circle cx="18" cy="18" r="12.5" fill="rgba(230,240,255,.18)"/>
  <path d="M10.5 14.5 A9 9 0 0 1 16 9.6" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 铜镜框：深色描边 + 金色外框 + 细内框 + 四颗小钉 -->
  <circle cx="18" cy="18" r="13.5" fill="none" stroke="#3a2008" stroke-width="5"/>
  <circle cx="18" cy="18" r="13.5" fill="none" stroke="url(#brass)" stroke-width="3.4"/>
  <circle cx="18" cy="18" r="11.2" fill="none" stroke="#8a6326" stroke-width=".7"/>
  <g fill="#fff4cf" fill-opacity=".85">
    <circle cx="18" cy="4.5" r=".75"/><circle cx="31.5" cy="18" r=".75"/><circle cx="18" cy="31.5" r=".75"/><circle cx="4.5" cy="18" r=".75"/>
  </g>
</svg>
